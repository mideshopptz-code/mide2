{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:500px;margin:auto">
<h1>{{ 'Edit' if product else 'Add' }} product</h1>
<form method="post">
<label>Название</label><input name="name" value="{{ product.name if product else '' }}" required>
<label>Категория</label><input name="category" value="{{ product.category if product else '' }}">
<label>Количество</label><input name="quantity" type="number" value="{{ product.quantity if product else 0 }}">
<label>Цена</label><input name="price" type="number" step="0.01" value="{{ product.price if product else 0 }}">
<label>Мин. остаток</label><input name="min_stock" type="number" value="{{ product.min_stock if product else 5 }}">
<button class="btn btn-success" type="submit">Сохранить</button>
<a href="/" class="btn" style="background:#95a5a6">Отмена</a>
</form></div>
{% endblock %}
